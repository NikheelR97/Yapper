version: 2

updates:
  # ── Frontend (SvelteKit + Tauri) ───────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Johannesburg
    groups:
      # Group related packages into single PRs to reduce noise
      svelte:
        patterns: ["svelte", "@sveltejs/*"]
      tauri:
        patterns: ["@tauri-apps/*"]
      noble-crypto:
        patterns: ["@noble/*"]
      capacitor:
        patterns: ["@capacitor/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "@playwright/*", "@testing-library/*"]
    ignore:
      # Avoid major-version bumps — review manually
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Marketing site (Astro) ─────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /marketing
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Johannesburg
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Backend (Rust) ─────────────────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Johannesburg
    groups:
      aws:
        patterns: ["aws-sdk-*", "aws-*"]
      axum-tower:
        patterns: ["axum", "tower", "tower-http", "hyper"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Tauri desktop shell (Rust) ─────────────────────────────────────────────
  # Accepted-risk transitives for this directory are documented in
  # frontend/src-tauri/osv-scanner.toml. Ignore entries below match advisories
  # that cannot be resolved without upstream Tauri/wry/GTK3 movement.
  - package-ecosystem: cargo
    directory: /frontend/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Johannesburg
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Blocked by Tauri/wry/GTK3 Linux desktop stack — see osv-scanner.toml.
      - dependency-name: "glib"
      # Blocked by Tauri tauri-utils -> kuchikiki -> selectors parser chain.
      - dependency-name: "rand"

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Johannesburg
