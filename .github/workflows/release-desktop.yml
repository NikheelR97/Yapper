name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build (for example v0.2.0)"
        required: true
        type: string
      release_channel:
        description: "Target channel for this build"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      api_url:
        description: "API base URL compiled into the desktop build"
        required: false
        default: "https://staging-api.yapperhq.com"
        type: string
      sentry_dsn:
        description: "Optional Sentry DSN for this release channel"
        required: false
        default: ""
        type: string

concurrency:
  group: release-desktop-${{ inputs.release_channel }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  VITE_API_URL: ${{ inputs.api_url }}
  VITE_FIREBASE_VAPID_KEY: BOrz15S2L_kg0_R5Tam_gbtO_Zf3LzTVFwzQGbCsDFLZgi6fG5DUk3KjIMLs4N3oGeaGkJcbxfeBlHGzDF5k8Cc
  VITE_SENTRY_DSN: ${{ inputs.sentry_dsn }}

permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate release inputs
    runs-on: ubuntu-latest

    steps:
      - name: Refuse production release automation
        shell: bash
        run: |
          case "${{ inputs.release_channel }}" in
            production)
              echo "Production desktop release automation is paused until the documented quality bar is proven in a dedicated promotion pipeline." >&2
              exit 1
              ;;
            staging)
              if [[ "${VITE_API_URL}" == "https://api.yapperhq.com" ]]; then
                echo "Staging releases must not target production." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unknown release channel: ${{ inputs.release_channel }}" >&2
              exit 1
              ;;
          esac

      - name: Write release posture summary
        shell: bash
        run: |
          {
            echo "## Desktop release posture"
            echo ""
            echo "This workflow is staging-only during stabilization."
            echo "Production desktop release automation is paused until the documented quality bar can be enforced in CI."
            echo ""
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Channel | ${{ inputs.release_channel }} |"
            echo "| Tag | ${{ inputs.tag }} |"
            echo "| API URL | ${VITE_API_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    needs: [validate-inputs]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Tauri app (Windows)
        run: npm run tauri build
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: yapper-windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

  e2e-windows:
    name: E2E Tests (Windows / Tauri)
    runs-on: windows-latest
    needs: [build-windows]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: yapper-windows
          path: frontend/src-tauri/target/release/bundle/

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Tauri E2E tests
        run: npx playwright test --project=tauri-desktop
        working-directory: frontend
        env:
          CI: "true"
          VITE_API_URL: ${{ env.VITE_API_URL }}
          TAURI_BINARY: src-tauri/target/release/yapper.exe

      - name: Upload Tauri test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tauri-e2e-results
          path: frontend/playwright-report/
          retention-days: 7

  build-macos:
    name: Build macOS (DMG + universal)
    runs-on: macos-latest
    needs: [validate-inputs]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain (with Apple Silicon target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Tauri app (macOS universal)
        run: npm run tauri build -- --target universal-apple-darwin
        working-directory: frontend
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: yapper-macos
          path: frontend/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30

  build-linux:
    name: Build Linux (AppImage + deb)
    runs-on: ubuntu-22.04
    needs: [validate-inputs]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Tauri app (Linux)
        run: npm run tauri build
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: yapper-linux
          path: |
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

  draft-release:
    name: Create staging draft release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux, e2e-windows]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: yapper-*

      - name: Create GitHub Release draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Yapper ${{ inputs.tag }} (staging)
          draft: true
          prerelease: true
          generate_release_notes: true
          files: |
            dist/yapper-windows/**
            dist/yapper-macos/**
            dist/yapper-linux/**
