name: E2E Smoke (PR)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e-pr-smoke.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/e2e-pr-smoke.yml'

permissions:
  contents: read

jobs:
  noop-on-main:
    name: No-op on main push
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Explain intentional no-op
        run: |
          echo "PR smoke runs only for pull_request events."
          echo "This successful no-op prevents a zero-job workflow failure when the workflow file changes on main."

  probe-auth:
    name: Probe E2E Auth Target
    runs-on: [self-hosted, linux, e2e, unraid]
    if: ${{ github.event_name == 'pull_request' }}
    outputs:
      should-run: ${{ steps.probe.outputs.should-run }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Probe login endpoint reachability
        id: probe
        shell: bash
        env:
          VITE_API_URL: ${{ vars.E2E_API_URL || 'https://api.yapperhq.com' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EMAIL_2: ${{ secrets.E2E_EMAIL_2 }}
          E2E_PASSWORD_2: ${{ secrets.E2E_PASSWORD_2 }}
        run: |
          probe_user() {
            local probe_email="$1"
            local probe_password="$2"
            local probe_installation_id="$3"
            local probe_label="$4"

            E2E_PROBE_EMAIL="$probe_email" \
            E2E_PROBE_PASSWORD="$probe_password" \
            E2E_PROBE_INSTALLATION_ID="$probe_installation_id" \
            E2E_PROBE_LABEL="$probe_label" \
              node tests/probe-auth.mjs
          }

          if [[ -z "${E2E_EMAIL}" || -z "${E2E_PASSWORD}" || -z "${E2E_EMAIL_2}" || -z "${E2E_PASSWORD_2}" ]]; then
            if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
              echo "should-run=false" >> "${GITHUB_OUTPUT}"
              echo "::notice::Skipping PR smoke for Dependabot because repository secrets are unavailable to Dependabot-triggered runs."
              exit 0
            fi

            echo "::error::PR smoke requires both E2E test accounts to be configured."
            exit 1
          fi

          echo "should-run=true" >> "${GITHUB_OUTPUT}"
          probe_user "${E2E_EMAIL}" "${E2E_PASSWORD}" "11111111-1111-4111-8111-111111111111" "GitHub Actions Probe A"
          probe_user "${E2E_EMAIL_2}" "${E2E_PASSWORD_2}" "22222222-2222-4222-8222-222222222222" "GitHub Actions Probe B"

  setup-auth:
    name: Setup E2E Auth State
    runs-on: [self-hosted, linux, e2e, unraid]
    if: ${{ github.event_name == 'pull_request' && needs.probe-auth.outputs.should-run == 'true' }}
    timeout-minutes: 10
    needs: [probe-auth]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate auth-state artifacts
        run: npm run test:setup-auth
        env:
          VITE_API_URL: ${{ vars.E2E_API_URL || 'https://api.yapperhq.com' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EMAIL_2: ${{ secrets.E2E_EMAIL_2 }}
          E2E_PASSWORD_2: ${{ secrets.E2E_PASSWORD_2 }}

      - name: Upload auth-state artifact
        uses: actions/upload-artifact@v7
        with:
          name: playwright-auth-state
          path: frontend/tests/auth-state/
          retention-days: 1

  smoke:
    name: Playwright Smoke (shard ${{ matrix.shard_index }}/${{ matrix.shard_total }})
    runs-on: [self-hosted, linux, e2e, unraid]
    timeout-minutes: 10
    needs: [setup-auth]
    if: ${{ github.event_name == 'pull_request' && needs.setup-auth.result == 'success' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 1
            shard_total: 2
            port: 6173
          - shard_index: 2
            shard_total: 2
            port: 6174

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Download auth-state artifact
        uses: actions/download-artifact@v8
        with:
          name: playwright-auth-state
          path: frontend/tests/auth-state/

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: Install Playwright system deps
        shell: bash
        run: |
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            npx playwright install-deps chromium webkit
          else
            echo "Skipping Playwright system deps install; runner does not allow passwordless sudo."
          fi

      - name: Run smoke tests
        run: npx playwright test --grep "@smoke" --shard=${{ matrix.shard_index }}/${{ matrix.shard_total }} --workers=4
        env:
          CI: 'true'
          BASE_URL: http://localhost:${{ matrix.port }}
          PLAYWRIGHT_WEB_SERVER_URL: http://localhost:${{ matrix.port }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EMAIL_2: ${{ secrets.E2E_EMAIL_2 }}
          E2E_PASSWORD_2: ${{ secrets.E2E_PASSWORD_2 }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results-${{ matrix.shard_index }}-of-${{ matrix.shard_total }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 5
