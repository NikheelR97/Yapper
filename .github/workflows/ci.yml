name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://yapper:yapper_dev@localhost:5432/yapper

permissions:
  contents: read

jobs:
  docs-sync:
    name: Docs Sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard against new HTTP route references
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: bash .github/scripts/check-no-v1-http-routes.sh

      - name: Verify security docs match implementation
        run: bash .github/scripts/check-doc-sync.sh

      - name: Verify repo docs match current release posture
        shell: bash
        run: |
          grep -Fq 'production deploy/release automation is paused' 'dev docs/HANDOVER.md'
          grep -Fq 'Canonical device-aware auth lives under `/api/v2/auth/*`' 'docs/api.md'
          grep -Fq '/api/v2/auth/login' 'docs/api.md'
          grep -Fq '/api/v2/devices' 'docs/api.md'
          grep -Fq 'Production deploy automation is paused in GitHub Actions during stabilization' 'docs/deployment.md'

  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yapper
          POSTGRES_PASSWORD: yapper_dev
          POSTGRES_DB: yapper
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Cache cargo tools (sqlx-cli)
        uses: actions/cache@v5
        id: cargo-tools-cache
        with:
          path: ~/.cargo/bin
          key: cargo-tools-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-tools-${{ runner.os }}-

      - name: Install sqlx-cli
        if: steps.cargo-tools-cache.outputs.cache-hit != 'true'
        # --force is needed because the cache `restore-keys` fallback can
        # restore stale binaries even when the primary key (which includes
        # Cargo.lock hash) misses — without --force, this step then errors
        # out with "binary already exists in destination".
        run: cargo install sqlx-cli --no-default-features --features postgres --locked --force
        working-directory: backend

      - name: Run migrations
        run: sqlx migrate run
        working-directory: backend

      - name: Check formatting
        run: cargo fmt --check
        working-directory: backend

      - name: Clippy (deny warnings)
        run: cargo clippy -- -D warnings
        working-directory: backend

      - name: Run unit tests
        run: cargo test --lib --bins
        working-directory: backend

      - name: Generate test JWT keys
        run: |
          mkdir -p secrets
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out secrets/jwt_private.pem
          openssl rsa -in secrets/jwt_private.pem -pubout -out secrets/jwt_public.pem
        working-directory: backend

      - name: Run integration tests
        run: cargo test --test integration
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://yapper:yapper_dev@localhost:5432/yapper
          JWT_PRIVATE_KEY_PATH: secrets/jwt_private.pem

      - name: Check sqlx query cache
        run: cargo sqlx prepare --check
        working-directory: backend

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Type check
        run: npm run check
        working-directory: frontend

      - name: Run unit tests
        run: npm run test
        working-directory: frontend

      - name: Build (verify no compile errors)
        run: npm run build
        working-directory: frontend

  marketing:
    name: Marketing site (Astro)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: marketing

      - name: Build
        run: npm run build
        working-directory: marketing

  security-scans:
    name: Security Scans
    uses: ./.github/workflows/security-scans.yml
    permissions:
      contents: read
      actions: write
    secrets: inherit

  # Smoke tests are handled by e2e-pr-smoke.yml on PRs with frontend/backend changes.
  #
  # --------------------------------------------------------------------------
  # Production deploy jobs below. These require:
  #   1. All CI checks (backend, frontend, marketing) to pass
  #   2. Security scans to pass (blocking — not a separate non-blocking workflow)
  #   3. Manual approval via the "production" GitHub environment
  #
  # Deploy automation is intentionally paused during stabilization. When
  # re-enabled, uncomment the jobs below. The `environment: production`
  # setting enforces a manual approval gate (configure required reviewers
  # in GitHub repo Settings > Environments > production).
  # --------------------------------------------------------------------------

