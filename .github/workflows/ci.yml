name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://yapper:yapper_dev@localhost:5432/yapper

jobs:
  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yapper
          POSTGRES_PASSWORD: yapper_dev
          POSTGRES_DB: yapper
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked
        working-directory: backend

      - name: Run migrations
        run: sqlx migrate run
        working-directory: backend

      - name: Check formatting
        run: cargo fmt --check
        working-directory: backend

      - name: Clippy (deny warnings)
        run: cargo clippy -- -D warnings
        working-directory: backend

      - name: Run tests
        run: cargo test
        working-directory: backend

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit
        run: cargo audit
        working-directory: backend

      - name: Check sqlx query cache
        run: cargo sqlx prepare --check
        working-directory: backend
        continue-on-error: true  # offline cache may not be committed yet

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npm run check
        working-directory: frontend

      - name: Run unit tests
        run: npm run test
        working-directory: frontend

      - name: Security audit
        run: npm audit --omit=dev
        working-directory: frontend
        continue-on-error: true  # advisory-only for now; promote to blocking once clean

      - name: Build
        run: npm run build
        working-directory: frontend

  # ─── Marketing site ──────────────────────────────────────────────────────────
  marketing:
    name: Marketing site (Astro)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: marketing

      - name: Build
        run: npm run build
        working-directory: marketing

  # ─── Deploy (main branch only) ───────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend to Fly.io
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-marketing:
    name: Deploy marketing to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [marketing]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: marketing

      - name: Build
        run: npm run build
        working-directory: marketing

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name yapper-marketing --branch main
        working-directory: marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3cb90d502ed2d67a8dadec9dac386425
