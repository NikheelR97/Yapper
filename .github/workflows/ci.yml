name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://yapper:yapper_dev@localhost:5432/yapper

permissions:
  contents: read

jobs:
  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yapper
          POSTGRES_PASSWORD: yapper_dev
          POSTGRES_DB: yapper
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # Cache installed cargo binaries separately — avoids ~5 min reinstall per run
      - name: Cache cargo tools (sqlx-cli)
        uses: actions/cache@v5
        id: cargo-tools-cache
        with:
          path: ~/.cargo/bin
          key: cargo-tools-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-tools-${{ runner.os }}-

      - name: Install sqlx-cli
        if: steps.cargo-tools-cache.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --no-default-features --features postgres --locked
        working-directory: backend

      - name: Run migrations
        run: sqlx migrate run
        working-directory: backend

      - name: Check formatting
        run: cargo fmt --check
        working-directory: backend

      - name: Clippy (deny warnings)
        run: cargo clippy -- -D warnings
        working-directory: backend

      - name: Run unit tests
        run: cargo test --lib --bins
        working-directory: backend

      - name: Run integration tests
        run: cargo test --test integration -- --test-threads=1
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://yapper:yapper_dev@localhost:5432/yapper
          JWT_PRIVATE_KEY_PATH: secrets/jwt_private.pem
        continue-on-error: true  # JWT key may not be committed; integration tests are optional in CI

      - name: Check sqlx query cache
        run: cargo sqlx prepare --check
        working-directory: backend

      # Security scanning (cargo audit + npm audit) is handled by security-scans.yml
      # to avoid running twice on pushes to main.

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npm run check
        working-directory: frontend

      - name: Run unit tests
        run: npm run test
        working-directory: frontend

      - name: Build (verify no compile errors)
        run: npm run build
        working-directory: frontend

      # Security scanning (npm audit) is handled by security-scans.yml.

  # ─── Marketing site ──────────────────────────────────────────────────────────
  marketing:
    name: Marketing site (Astro)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: marketing

      - name: Build
        run: npm run build
        working-directory: marketing

  # ─── E2E Smoke Gate ─────────────────────────────────────────────────────────
  # Smoke tests are handled by e2e-pr-smoke.yml (on PRs with frontend changes).
  # Removed duplicate e2e-smoke job from this workflow to avoid running twice.

  # ─── Deploy (main branch only) ───────────────────────────────────────────────

  deploy-frontend:
    name: Deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build (production)
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.yapperhq.com
          VITE_FIREBASE_VAPID_KEY: BOrz15S2L_kg0_R5Tam_gbtO_Zf3LzTVFwzQGbCsDFLZgi6fG5DUk3KjIMLs4N3oGeaGkJcbxfeBlHGzDF5k8Cc
          VITE_SENTRY_DSN: https://2fe4d6f44e9985a1ac07cec40fb24e33@o4510987106123776.ingest.de.sentry.io/4510987113398352

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy build --project-name yapper-app --branch main
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3cb90d502ed2d67a8dadec9dac386425

  deploy-backend:
    name: Deploy backend to Fly.io
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Fly.io registry
        uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            registry.fly.io/yapper-api:latest
            registry.fly.io/yapper-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy pre-built image to Fly.io
        run: flyctl deploy --image registry.fly.io/yapper-api:${{ github.sha }} --wait-timeout 300
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test — verify API health
        run: |
          echo "Waiting for machines to stabilise..."
          sleep 15
          for i in 1 2 3; do
            if curl --silent --fail --max-time 10 https://api.yapperhq.com/health | grep -q '"status"'; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 3 attempts"
          exit 1

  deploy-marketing:
    name: Deploy marketing to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [marketing]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: marketing

      - name: Build
        run: npm run build
        working-directory: marketing
        env:
          PUBLIC_API_URL: https://yapperhq.com

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name yapper-marketing --branch main
        working-directory: marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3cb90d502ed2d67a8dadec9dac386425

      - name: Deploy wishlist Worker
        run: npx wrangler deploy
        working-directory: marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3cb90d502ed2d67a8dadec9dac386425
