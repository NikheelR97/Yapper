name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://yapper:yapper_dev@localhost:5432/yapper

jobs:
  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yapper
          POSTGRES_PASSWORD: yapper_dev
          POSTGRES_DB: yapper
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # Cache installed cargo binaries separately — avoids ~5 min reinstall per run
      - name: Cache cargo tools (sqlx-cli, cargo-audit)
        uses: actions/cache@v5
        id: cargo-tools-cache
        with:
          path: ~/.cargo/bin
          key: cargo-tools-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-tools-${{ runner.os }}-

      - name: Install sqlx-cli
        if: steps.cargo-tools-cache.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --no-default-features --features postgres --locked
        working-directory: backend

      - name: Install cargo-audit
        if: steps.cargo-tools-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: Run migrations
        run: sqlx migrate run
        working-directory: backend

      - name: Check formatting
        run: cargo fmt --check
        working-directory: backend

      - name: Clippy (deny warnings)
        run: cargo clippy -- -D warnings
        working-directory: backend

      - name: Run tests
        run: cargo test
        working-directory: backend

      - name: Security audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2024-0363 \
            --ignore RUSTSEC-2024-0421
        # RUSTSEC-2023-0071: rsa/Marvin Attack — via sqlx-mysql (not a live code path; Postgres only)
        # RUSTSEC-2024-0363: sqlx 0.7.4 — fix requires sqlx 0.8 major migration; tracked in backlog
        # RUSTSEC-2024-0421: idna via validator 0.18 — fix requires validator upgrade; tracked in backlog
        working-directory: backend

      - name: Check sqlx query cache
        run: cargo sqlx prepare --check
        working-directory: backend
        continue-on-error: true  # offline cache may not be committed yet

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npm run check
        working-directory: frontend

      - name: Run unit tests
        run: npm run test
        working-directory: frontend

      - name: Security audit
        run: npm audit --omit=dev
        working-directory: frontend
        continue-on-error: true  # advisory-only for now; promote to blocking once clean

      - name: Build (verify no compile errors)
        run: npm run build
        working-directory: frontend

  # ─── Marketing site ──────────────────────────────────────────────────────────
  marketing:
    name: Marketing site (Astro)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: marketing

      - name: Build
        run: npm run build
        working-directory: marketing

  # ─── Deploy (main branch only) ───────────────────────────────────────────────

  deploy-frontend:
    name: Deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build (production)
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.yapperhq.com
          VITE_FIREBASE_VAPID_KEY: BOrz15S2L_kg0_R5Tam_gbtO_Zf3LzTVFwzQGbCsDFLZgi6fG5DUk3KjIMLs4N3oGeaGkJcbxfeBlHGzDF5k8Cc
          VITE_SENTRY_DSN: https://2fe4d6f44e9985a1ac07cec40fb24e33@o4510987106123776.ingest.de.sentry.io/4510987113398352

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy build --project-name yapper-app --branch main
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3cb90d502ed2d67a8dadec9dac386425

  deploy-backend:
    name: Deploy backend to Fly.io
    runs-on: ubuntu-latest
    # Only depends on backend — decoupled from frontend so both deploys run in parallel
    needs: [backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v6

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --wait-timeout 300
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test — verify API health
        run: |
          echo "Waiting for machines to stabilise..."
          sleep 15
          for i in 1 2 3; do
            if curl --silent --fail --max-time 10 https://api.yapperhq.com/health | grep -q '"status"'; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 3 attempts"
          exit 1

  deploy-marketing:
    name: Deploy marketing to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [marketing]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: marketing

      - name: Build
        run: npm run build
        working-directory: marketing
        env:
          PUBLIC_API_URL: https://yapperhq.com

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name yapper-marketing --branch main
        working-directory: marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3cb90d502ed2d67a8dadec9dac386425
