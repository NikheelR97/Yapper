# Advanced CodeQL setup.
#
# This replaces the repository's CodeQL "default setup". It exists for one
# reason: the default setup analyzed Rust with `build-mode: none`, which
# extracts source without compiling and therefore can't resolve trait methods
# or generic types from the compiler. That produced the "Low Rust analysis
# quality" diagnostic (call-target ~39% < 50% threshold, known-type ~44%).
#
# Here Rust uses `build-mode: autobuild` (a real `cargo build`) so the extractor
# gets type information straight from the compiler. The backend crate builds
# against its committed `.sqlx` offline cache (SQLX_OFFLINE=true), so no database
# is needed.
#
# NOTE: advanced setup cannot coexist with CodeQL default setup — default setup
# must be disabled or SARIF uploads fail with a configuration error.
#
# JavaScript/TypeScript and GitHub Actions keep build-mode: none, matching the
# default setup they replace.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, matching the cadence of the default setup this replaces.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    # Build the backend against its committed .sqlx offline cache so CodeQL's
    # autobuild needs no database. Harmless for the non-Rust matrix legs.
    env:
      SQLX_OFFLINE: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Rust only supports `none` or `autobuild` (no manual mode).
          # autobuild runs `cargo build` so CodeQL resolves types and call
          # targets from the compiler instead of source-only extraction.
          - language: rust
            build-mode: autobuild
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # These steps must run BEFORE init: autobuild executes inside the init
      # step, so the toolchain, cache, and system libraries have to exist first.
      - name: Install Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            frontend/src-tauri

      # The Tauri crate links against webkit2gtk/gtk on Linux; without these
      # libs its build fails and would abort autobuild.
      - name: Install Tauri system dependencies
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
