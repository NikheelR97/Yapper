# Advanced CodeQL setup.
#
# This replaces the repository's CodeQL "default setup". It targets the
# "Low Rust analysis quality" diagnostic (call-target ~39% < 50% threshold,
# known-type ~44%).
#
# IMPORTANT: CodeQL's Rust extractor only supports `build-mode: none` — there is
# no `autobuild`/`manual` mode for Rust in this CodeQL version. So Rust is always
# analyzed buildless. The lever we DO have is making dependency sources
# resolvable before extraction: the buildless extractor invokes cargo to read
# dependency metadata/sources, so installing the toolchain, fetching deps, and
# setting SQLX_OFFLINE (so sqlx's compile-time macros expand against the
# committed .sqlx cache) gives it more types/call-targets to resolve. This may
# improve the metrics but cannot fully match a compiled analysis.
#
# NOTE: advanced setup cannot coexist with CodeQL default setup — default setup
# must be disabled or SARIF uploads fail with a configuration error.
#
# JavaScript/TypeScript and GitHub Actions keep build-mode: none, matching the
# default setup they replace.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, matching the cadence of the default setup this replaces.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    # Lets sqlx's compile-time macros expand against the committed .sqlx cache
    # during extraction; harmless for the non-Rust matrix legs.
    env:
      SQLX_OFFLINE: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Rust only supports build-mode: none (no autobuild/manual exists).
          - language: rust
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Make Rust dependency sources resolvable for the buildless extractor.
      # These run before init so the toolchain and fetched crates are present.
      - name: Install Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch Rust dependencies
        if: matrix.language == 'rust'
        run: |
          cargo fetch --manifest-path backend/Cargo.toml
          cargo fetch --manifest-path frontend/src-tauri/Cargo.toml || true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
