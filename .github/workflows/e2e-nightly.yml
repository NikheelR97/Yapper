name: E2E Nightly / Manual

on:
  schedule:
    # Run nightly at 02:00 SAST (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Frontend base URL to run Playwright against"
        required: false
        default: "https://staging.yapperhq.com"
        type: string
      api_url:
        description: "Backend API base URL used by seeded test flows"
        required: false
        default: "https://staging-api.yapperhq.com"
        type: string
      allow_production:
        description: "Allow production URLs for this manual run"
        required: false
        default: false
        type: boolean

concurrency:
  group: e2e-${{ github.event.inputs.base_url || 'staging' }}-${{ github.event.inputs.api_url || 'staging' }}
  cancel-in-progress: false

env:
  # For scheduled runs, default to staging. For manual runs, use input values.
  BASE_URL: ${{ github.event.inputs.base_url || 'https://staging.yapperhq.com' }}
  VITE_API_URL: ${{ github.event.inputs.api_url || 'https://staging-api.yapperhq.com' }}

permissions:
  contents: read

jobs:
  guard:
    name: Validate target URLs
    runs-on: ubuntu-latest

    steps:
      - name: Refuse production URLs by default
        shell: bash
        run: |
          base_url="${BASE_URL}"
          api_url="${VITE_API_URL}"

          if [[ -z "${base_url}" || -z "${api_url}" ]]; then
            echo "Both base_url and api_url are required." >&2
            exit 1
          fi

          for target in "${base_url}" "${api_url}"; do
            case "${target}" in
              https://app.yapperhq.com*|https://api.yapperhq.com*)
                if [[ "${{ github.event.inputs.allow_production }}" != "true" ]]; then
                  echo "::error::Refusing to target production without explicit allow_production=true."
                  echo "Refusing to target production without explicit allow_production=true." >&2
                  exit 1
                fi
                ;;
            esac
          done

          echo "Targeting: base_url=${base_url}, api_url=${api_url}"

  probe-auth:
    name: Probe E2E Auth Target
    runs-on: [self-hosted, linux, e2e, unraid]
    needs: [guard]
    outputs:
      reachable: ${{ steps.probe.outputs.reachable }}
      skip_reason: ${{ steps.probe.outputs.skip_reason }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Probe login endpoint reachability
        id: probe
        shell: bash
        run: |
          probe_user() {
            local probe_email="$1"
            local probe_password="$2"
            local probe_installation_id="$3"
            local probe_label="$4"

            set +e
            E2E_PROBE_EMAIL="$probe_email" \
            E2E_PROBE_PASSWORD="$probe_password" \
            E2E_PROBE_INSTALLATION_ID="$probe_installation_id" \
            E2E_PROBE_LABEL="$probe_label" \
              node tests/probe-auth.mjs
            PROBE_STATUS=$?
            set -e
            return 0
          }

          probe_user "${E2E_EMAIL}" "${E2E_PASSWORD}" "11111111-1111-4111-8111-111111111111" "GitHub Actions Probe A"
          status=$PROBE_STATUS
          if [[ "$status" -eq 0 ]]; then
            probe_user "${E2E_EMAIL_2}" "${E2E_PASSWORD_2}" "22222222-2222-4222-8222-222222222222" "GitHub Actions Probe B"
            status=$PROBE_STATUS
          fi

          if [[ "$status" -eq 0 ]]; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status" -eq 20 ]]; then
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=edge-blocked" >> "$GITHUB_OUTPUT"
            {
              echo "## E2E Nightly skipped"
              echo ""
              echo "Auth target \`${VITE_API_URL}\` was unreachable or blocked from the self-hosted E2E runner."
              echo "Skipping nightly E2E jobs instead of failing the repository."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::Auth probe failed with status ${status}. Check credentials or endpoint configuration."
          exit "$status"
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EMAIL_2: ${{ secrets.E2E_EMAIL_2 }}
          E2E_PASSWORD_2: ${{ secrets.E2E_PASSWORD_2 }}

  setup-auth:
    name: Setup E2E Auth State
    runs-on: [self-hosted, linux, e2e, unraid]
    if: ${{ needs.probe-auth.outputs.reachable == 'true' }}
    needs: [guard, probe-auth]
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Generate auth-state artifacts
        run: npm run test:setup-auth
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EMAIL_2: ${{ secrets.E2E_EMAIL_2 }}
          E2E_PASSWORD_2: ${{ secrets.E2E_PASSWORD_2 }}

      - name: Upload auth-state artifact
        uses: actions/upload-artifact@v7
        with:
          name: playwright-auth-state
          path: frontend/tests/auth-state/
          retention-days: 1

  seed:
    name: Seed test devices
    runs-on: [self-hosted, linux, e2e, unraid]
    timeout-minutes: 5
    if: ${{ needs.probe-auth.outputs.reachable == 'true' }}
    needs: [guard, probe-auth]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Seed devices
        run: node tests/seed-devices.mjs
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_SKIP_SECONDARY_DEVICE: "1"

  playwright:
    name: Playwright E2E (${{ matrix.project }} shard ${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    if: ${{ needs.probe-auth.outputs.reachable == 'true' }}
    needs: [probe-auth, seed, setup-auth]
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            shard: 1/3
            runner: [self-hosted, linux, e2e, unraid]
          - project: chromium
            shard: 2/3
            runner: [self-hosted, linux, e2e, unraid]
          - project: chromium
            shard: 3/3
            runner: [self-hosted, linux, e2e, unraid]
          - project: mobile-chrome
            shard: 1/1
            runner: [self-hosted, linux, e2e, unraid]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Download auth-state artifact
        uses: actions/download-artifact@v8
        with:
          name: playwright-auth-state
          path: frontend/tests/auth-state/

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit
        working-directory: frontend

      - name: Install Playwright system deps
        shell: bash
        run: |
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            npx playwright install-deps chromium webkit
          else
            echo "Skipping Playwright system deps install; runner does not allow passwordless sudo."
          fi
        working-directory: frontend

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }} --workers=4
        working-directory: frontend
        env:
          CI: "true"
          NIGHTLY: "true"
          ALLURE: "true"
          BASE_URL: ${{ env.BASE_URL }}
          VITE_API_URL: ${{ env.VITE_API_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EMAIL_2: ${{ secrets.E2E_EMAIL_2 }}
          E2E_PASSWORD_2: ${{ secrets.E2E_PASSWORD_2 }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.project }}-${{ strategy.job-index }}
          path: frontend/allure-results/
          retention-days: 14

      - name: Upload traces, videos, and HAR on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.project }}-${{ strategy.job-index }}
          path: frontend/test-results/
          retention-days: 14

  combine-allure:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [probe-auth, playwright]
    if: always() && needs.probe-auth.outputs.reachable == 'true' && needs.playwright.result != 'skipped'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install allure-commandline
        run: npm install -g allure-commandline

      - name: Download all Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results/

      - name: Generate Allure HTML report
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Write summary
        shell: bash
        run: |
          echo "## E2E Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Frontend URL tested:** ${BASE_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "**API URL tested:** ${VITE_API_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Projects:** chromium (x3 shards), mobile-chrome (x1 shard)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Trigger:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"

  # This job enforces that ALL playwright shards passed. The combine-allure job
  # runs with if: always() to generate reports even on failure, but this job
  # will fail the workflow if any shard failed.
  #
  # An edge-blocked auth target (probe-auth.outputs.reachable != 'true') used
  # to exit 0 here, on the theory that a self-hosted runner's intermittent
  # network problem should not page the team. In practice it produced silent
  # green nightlies for at least 6 consecutive nights against an un-provisioned
  # staging environment — false-green is worse than red. The gate now treats
  # edge-blocked as a real failure so the nightly's status reflects whether
  # the suite actually ran. The graceful-skip behaviour was removed
  # deliberately, not by accident; do not re-introduce without a real signal
  # path replacing it.
  e2e-result:
    name: E2E Result
    runs-on: ubuntu-latest
    needs: [probe-auth, playwright]
    if: always()

    steps:
      - name: Check playwright result
        shell: bash
        run: |
          if [[ "${{ needs.probe-auth.outputs.reachable }}" != "true" ]]; then
            echo "::error::E2E nightly auth target was unreachable (reason: ${{ needs.probe-auth.outputs.skip_reason }}). Suite did not run. Provision staging or fix runner egress; see docs/deployment.md § Staging environment."
            exit 1
          fi
          if [[ "${{ needs.playwright.result }}" != "success" ]]; then
            echo "::error::E2E tests did not pass. Result: ${{ needs.playwright.result }}"
            exit 1
          fi
          echo "All E2E shards passed."
