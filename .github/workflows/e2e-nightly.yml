name: E2E Nightly

on:
  schedule:
    # 02:00 SAST (Africa/Johannesburg = UTC+2) = 00:00 UTC — runs against production
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to run Playwright against'
        required: false
        default: 'https://app.yapperhq.com'

env:
  BASE_URL: ${{ github.event.inputs.base_url || 'https://app.yapperhq.com' }}

jobs:
  playwright:
    name: Playwright E2E (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
        working-directory: frontend

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shard }}
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.BASE_URL }}
          # Test account credentials injected from secrets
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_USER2_EMAIL: ${{ secrets.E2E_USER2_EMAIL }}
          E2E_USER2_PASSWORD: ${{ secrets.E2E_USER2_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: frontend/playwright-report/
          retention-days: 7

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [playwright]
    if: failure() && github.event_name == 'schedule'

    steps:
      - name: Post failure summary
        run: |
          echo "## ❌ Nightly E2E Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**URL tested:** ${{ env.BASE_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the Playwright reports in the artifacts above." >> $GITHUB_STEP_SUMMARY
