name: E2E Nightly

on:
  schedule:
    # 02:00 SAST (Africa/Johannesburg = UTC+2) = 00:00 UTC — runs against production
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to run Playwright against'
        required: false
        default: 'https://app.yapperhq.com'

env:
  BASE_URL: ${{ github.event.inputs.base_url || 'https://app.yapperhq.com' }}

permissions:
  contents: read

jobs:
  # ─── Seed once before shards run ─────────────────────────────────────────────
  seed:
    name: Seed test devices
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Seed devices
        run: node tests/seed-devices.mjs
        working-directory: frontend
        env:
          VITE_API_URL: https://api.yapperhq.com
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_SKIP_SECONDARY_DEVICE: '1'
        continue-on-error: true

  # ─── Playwright shards ───────────────────────────────────────────────────────
  playwright:
    name: Playwright E2E (${{ matrix.project }} shard ${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    needs: [seed]
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            shard: 1/3
            runner: ubuntu-latest
          - project: chromium
            shard: 2/3
            runner: ubuntu-latest
          - project: chromium
            shard: 3/3
            runner: ubuntu-latest
          # mobile-chrome has few tests — only needs 1 shard
          - project: mobile-chrome
            shard: 1/1
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
        working-directory: frontend

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium webkit
        working-directory: frontend

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        working-directory: frontend
        env:
          CI: true
          NIGHTLY: 'true'
          ALLURE: 'true'
          BASE_URL: ${{ env.BASE_URL }}
          VITE_API_URL: https://api.yapperhq.com
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EMAIL_2: ${{ secrets.E2E_EMAIL_2 }}
          E2E_PASSWORD_2: ${{ secrets.E2E_PASSWORD_2 }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Allure results (for combined report)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.project }}-${{ strategy.job-index }}
          path: frontend/allure-results/
          retention-days: 14

      - name: Upload traces, videos, and HAR on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            frontend/test-results/
          retention-days: 14

  combine-allure:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [playwright]
    if: always()

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install allure-commandline
        run: npm install -g allure-commandline

      - name: Download all Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results/
        continue-on-error: true

      - name: Generate Allure HTML report
        run: allure generate allure-results --clean -o allure-report
        continue-on-error: true

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Write nightly summary
        if: always()
        run: |
          echo "## Nightly E2E — $(date -u '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL tested:** ${{ env.BASE_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Projects:** chromium (×3 shards), mobile-chrome (×1 shard)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Allure report available in the \`allure-report\` artifact (30-day retention)." >> $GITHUB_STEP_SUMMARY

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [playwright]
    if: failure() && github.event_name == 'schedule'
    permissions: {}

    steps:
      - name: Post failure summary
        run: |
          echo "## ❌ Nightly E2E Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**URL tested:** ${{ env.BASE_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the Playwright HTML reports and Allure report in the artifacts." >> $GITHUB_STEP_SUMMARY
