name: E2E Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-auth:
    name: Probe E2E Auth Target
    runs-on: [self-hosted, linux, e2e, unraid]
    outputs:
      reachable: ${{ steps.probe.outputs.reachable }}
      skip_reason: ${{ steps.probe.outputs.skip_reason }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Probe login endpoint reachability
        id: probe
        shell: bash
        run: |
          probe_user() {
            local probe_email="$1"
            local probe_password="$2"
            local probe_installation_id="$3"
            local probe_label="$4"

            set +e
            E2E_PROBE_EMAIL="$probe_email" \
            E2E_PROBE_PASSWORD="$probe_password" \
            E2E_PROBE_INSTALLATION_ID="$probe_installation_id" \
            E2E_PROBE_LABEL="$probe_label" \
              node tests/probe-auth.mjs
            PROBE_STATUS=$?
            set -e
            return 0
          }

          probe_user "${E2E_EMAIL}" "${E2E_PASSWORD}" "11111111-1111-4111-8111-111111111111" "GitHub Actions Probe A"
          status=$PROBE_STATUS
          if [[ "$status" -eq 0 ]]; then
            probe_user "${E2E_EMAIL_2}" "${E2E_PASSWORD_2}" "22222222-2222-4222-8222-222222222222" "GitHub Actions Probe B"
            status=$PROBE_STATUS
          fi

          if [[ "$status" -eq 0 ]]; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status" -eq 20 ]]; then
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=edge-blocked" >> "$GITHUB_OUTPUT"
            {
              echo "## E2E Security skipped"
              echo ""
              echo "Auth target \`${VITE_API_URL}\` was unreachable or blocked from the self-hosted E2E runner."
              echo "Skipping security E2E jobs instead of failing the repository."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::Auth probe failed with status ${status}. Check credentials or endpoint configuration."
          exit "$status"
        env:
          VITE_API_URL: ${{ vars.E2E_API_URL || 'https://api.yapperhq.com' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EMAIL_2: ${{ secrets.E2E_EMAIL_2 }}
          E2E_PASSWORD_2: ${{ secrets.E2E_PASSWORD_2 }}

  setup-auth:
    name: Setup E2E Auth State
    runs-on: [self-hosted, linux, e2e, unraid]
    if: ${{ needs.probe-auth.outputs.reachable == 'true' }}
    needs: [probe-auth]
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Generate auth-state artifacts
        run: npm run test:setup-auth
        env:
          VITE_API_URL: ${{ vars.E2E_API_URL || 'https://api.yapperhq.com' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EMAIL_2: ${{ secrets.E2E_EMAIL_2 }}
          E2E_PASSWORD_2: ${{ secrets.E2E_PASSWORD_2 }}

      - name: Upload auth-state artifact
        uses: actions/upload-artifact@v7
        with:
          name: playwright-auth-state
          path: frontend/tests/auth-state/
          retention-days: 1

  security:
    name: Playwright Security
    runs-on: [self-hosted, linux, e2e, unraid]
    if: ${{ needs.probe-auth.outputs.reachable == 'true' }}
    needs: [probe-auth, setup-auth]
    timeout-minutes: 12

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Download auth-state artifact
        uses: actions/download-artifact@v8
        with:
          name: playwright-auth-state
          path: frontend/tests/auth-state/

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Install Playwright system deps
        shell: bash
        run: |
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            npx playwright install-deps chromium
          else
            echo "Skipping Playwright system deps install; runner does not allow passwordless sudo."
          fi

      - name: Run security tests
        run: npx playwright test --grep "@security|@xss|@e2ee|@auth"
        env:
          CI: "true"
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EMAIL_2: ${{ secrets.E2E_EMAIL_2 }}
          E2E_PASSWORD_2: ${{ secrets.E2E_PASSWORD_2 }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-security-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14

  security-result:
    name: E2E Security Result
    runs-on: ubuntu-latest
    needs: [probe-auth, security]
    if: always()

    steps:
      - name: Finalize workflow result
        shell: bash
        run: |
          if [[ "${{ needs.probe-auth.outputs.reachable }}" != "true" ]]; then
            echo "E2E Security skipped due to edge-blocked auth target: ${{ needs.probe-auth.outputs.skip_reason }}"
            exit 0
          fi
          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "::error::Security E2E tests did not pass. Result: ${{ needs.security.result }}"
            exit 1
          fi
          echo "Security E2E tests passed."
