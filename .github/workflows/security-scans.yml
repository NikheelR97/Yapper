name: Security Scans

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  security-scans:
    name: Repository Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # Ignore list is sourced from backend/.cargo/audit.toml so local and
        # CI runs use a single source of truth (audit ref: LOW-009).
        run: cargo audit
        working-directory: backend

      - name: Install marketing dependencies
        run: npm ci
        working-directory: marketing

      # --audit-level=high aligns the npm audit gate with the Trivy gate
      # below (which already filters to severity: HIGH,CRITICAL). Moderate
      # advisories surface in Dependabot alerts and are tracked there
      # without blocking every push to main.
      - name: Run npm audit (frontend)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

      - name: Run npm audit (marketing)
        run: npm audit --omit=dev --audit-level=high
        working-directory: marketing

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install OSV-Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.3

      - name: Run OSV-Scanner
        run: ~/go/bin/osv-scanner scan source --recursive .

  heavy-security-scans:
    name: Heavy Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect backend image scan scope
        id: image-scope
        shell: bash
        run: |
          set -euo pipefail

          should_run=false
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            should_run=true
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              should_run=true
            elif git diff --name-only "$base" "$head" | grep -Eq '^(backend/|\.github/workflows/(ci|security-scans)\.yml|\.dockerignore$)'; then
              should_run=true
            fi
          fi

          echo "should-run-image=${should_run}" >> "$GITHUB_OUTPUT"
          if [[ "$should_run" == "true" ]]; then
            echo "Backend image scan is in scope."
          else
            echo "Skipping backend image scan; no backend, Docker, or security workflow files changed."
          fi

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: error

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,config
          skip-dirs: frontend/node_modules,marketing/node_modules,scripts/node_modules
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Set up Docker Buildx
        if: steps.image-scope.outputs.should-run-image == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build backend image for scanning
        if: steps.image-scope.outputs.should-run-image == 'true'
        uses: docker/build-push-action@v6
        timeout-minutes: 15
        with:
          context: backend
          file: backend/Dockerfile
          tags: yapper-backend-security-scan:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy image scan
        if: steps.image-scope.outputs.should-run-image == 'true'
        uses: aquasecurity/trivy-action@v0.35.0
        timeout-minutes: 8
        with:
          scan-type: image
          image-ref: yapper-backend-security-scan:latest
          scanners: vuln,secret,config
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
