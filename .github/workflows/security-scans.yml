name: Security Scans

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # Pinned versions for reproducibility. Bump deliberately — a change here
  # invalidates the cache below and triggers a fresh --locked build from
  # source, preserving the supply-chain integrity of the install path.
  CARGO_AUDIT_VERSION: "0.22.1"
  OSV_SCANNER_VERSION: "2.3.3"

jobs:
  security-scans:
    name: Repository Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # cargo-audit is installed once per version pin and cached. The cache
      # key includes the pinned version, so a deliberate version bump
      # invalidates the cache and triggers a fresh `cargo install --locked`
      # build from the same RustSec source the in-line install would have
      # produced. Same binary, same scan, faster wall time on cache hits.
      - name: Cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-${{ runner.os }}

      - name: Install Rust toolchain
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked

      - name: Ensure cargo bin on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run cargo audit
        # Ignore list is sourced from backend/.cargo/audit.toml so local and
        # CI runs use a single source of truth (audit ref: LOW-009).
        run: cargo audit
        working-directory: backend

      # --audit-level=high aligns the npm audit gate with the Trivy gate
      # below (which already filters to severity: HIGH,CRITICAL). Moderate
      # advisories surface in Dependabot alerts and are tracked there
      # without blocking every push to main.
      - name: Run npm audit (frontend)
        run: npm audit --package-lock-only --omit=dev --audit-level=high
        working-directory: frontend

      - name: Run npm audit (marketing)
        run: npm audit --package-lock-only --omit=dev --audit-level=high
        working-directory: marketing

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      # osv-scanner follows the same cache pattern as cargo-audit above:
      # version-pinned, cache-keyed by version, fresh `go install` on miss.
      - name: Cache osv-scanner binary
        id: cache-osv-scanner
        uses: actions/cache@v4
        with:
          path: ~/go/bin/osv-scanner
          key: osv-scanner-${{ env.OSV_SCANNER_VERSION }}-${{ runner.os }}

      - name: Setup Go
        if: steps.cache-osv-scanner.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      - name: Install OSV-Scanner
        if: steps.cache-osv-scanner.outputs.cache-hit != 'true'
        run: go install "github.com/google/osv-scanner/v2/cmd/osv-scanner@v${OSV_SCANNER_VERSION}"

      - name: Run OSV-Scanner
        run: ~/go/bin/osv-scanner scan source --recursive .

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,config
          skip-dirs: frontend/node_modules,marketing/node_modules,scripts/node_modules
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  heavy-security-scans:
    name: Heavy Security Scans
    runs-on: [self-hosted, linux, e2e, unraid]
    timeout-minutes: 25
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image for scanning
        uses: docker/build-push-action@v6
        timeout-minutes: 25
        with:
          context: backend
          file: backend/Dockerfile
          tags: yapper-backend-security-scan:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        timeout-minutes: 8
        with:
          scan-type: image
          image-ref: yapper-backend-security-scan:latest
          scanners: vuln,secret,config
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
