name: Security Scans

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  security-scans:
    name: Repository Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # Ignore list is sourced from backend/.cargo/audit.toml so local and
        # CI runs use a single source of truth (audit ref: LOW-009).
        run: cargo audit
        working-directory: backend

      # --audit-level=high aligns the npm audit gate with the Trivy gate
      # below (which already filters to severity: HIGH,CRITICAL). Moderate
      # advisories surface in Dependabot alerts and are tracked there
      # without blocking every push to main.
      - name: Run npm audit (frontend)
        run: npm audit --package-lock-only --omit=dev --audit-level=high
        working-directory: frontend

      - name: Run npm audit (marketing)
        run: npm audit --package-lock-only --omit=dev --audit-level=high
        working-directory: marketing

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      - name: Install OSV-Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.3

      - name: Run OSV-Scanner
        run: ~/go/bin/osv-scanner scan source --recursive .

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,config
          skip-dirs: frontend/node_modules,marketing/node_modules,scripts/node_modules
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  heavy-security-scans:
    name: Heavy Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image for scanning
        uses: docker/build-push-action@v6
        timeout-minutes: 25
        with:
          context: backend
          file: backend/Dockerfile
          tags: yapper-backend-security-scan:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        timeout-minutes: 8
        with:
          scan-type: image
          image-ref: yapper-backend-security-scan:latest
          scanners: vuln,secret,config
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
