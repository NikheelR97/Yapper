<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 3D sphere gradient — light source at top-left -->
    <radialGradient id="sphere" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </radialGradient>

    <!-- Outer glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="85%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner shadow filter for depth -->
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset dx="0" dy="10" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>

    <!-- Soft drop shadow for sphere -->
    <filter id="sphereShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.486  0 0 0 0 0.227  0 0 0 0 0.929  0 0 0 0.4 0" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Highlight filter -->
    <radialGradient id="highlight" cx="38%" cy="30%" r="25%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Glow ring -->
  <circle cx="256" cy="256" r="240" fill="url(#glow)"/>

  <!-- Main sphere -->
  <circle cx="256" cy="256" r="200" fill="url(#sphere)" filter="url(#sphereShadow)"/>

  <!-- Specular highlight -->
  <circle cx="256" cy="256" r="200" fill="url(#highlight)"/>

  <!-- Orbital ring (decorative) -->
  <ellipse cx="256" cy="256" rx="230" ry="80" fill="none" stroke="#a78bfa" stroke-opacity="0.12" stroke-width="1.5" transform="rotate(-25 256 256)"/>

  <!-- "Y" letterform -->
  <text x="256" y="296" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="200" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">Y</text>
</svg>
