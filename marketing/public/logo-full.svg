<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <!-- 3D sphere gradient -->
    <radialGradient id="sphere-g" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </radialGradient>

    <!-- Sphere glow -->
    <filter id="glow-f" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.486  0 0 0 0 0.227  0 0 0 0 0.929  0 0 0 0.35 0" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Specular highlight -->
    <radialGradient id="hl" cx="38%" cy="30%" r="25%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Wordmark gradient -->
    <linearGradient id="text-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f9fafb"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Sphere icon -->
  <g transform="translate(60, 60)">
    <!-- Glow -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#7c3aed" stroke-opacity="0.12" stroke-width="2"/>
    <!-- Sphere -->
    <circle cx="0" cy="0" r="38" fill="url(#sphere-g)" filter="url(#glow-f)"/>
    <!-- Highlight -->
    <circle cx="0" cy="0" r="38" fill="url(#hl)"/>
    <!-- Orbital ring -->
    <ellipse cx="0" cy="0" rx="44" ry="16" fill="none" stroke="#a78bfa" stroke-opacity="0.1" stroke-width="1" transform="rotate(-25)"/>
    <!-- Y letterform -->
    <text x="0" y="14" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="800" fill="#ffffff">Y</text>
  </g>

  <!-- Wordmark -->
  <text x="120" y="74" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="48" font-weight="800" fill="url(#text-g)" letter-spacing="-0.02em">Yapper</text>
</svg>
