# cargo-audit configuration.
#
# Audit ref: LOW-009 — these advisories were previously hardcoded in
# .github/workflows/security-scans.yml only, which made local `cargo audit`
# runs disagree with CI. This file is the single source of truth so that
# local and CI runs always exclude the same set, and the rationale + review
# date is auditable from the repo.
#
# IMPORTANT: every entry must include a justification and a review date.
# Re-review quarterly.

[advisories]
ignore = [
    # rsa via sqlx-mysql — Yapper uses Postgres only, the vulnerable code path
    # is unreachable. Tracked: drop sqlx-mysql when migrating to sqlx 0.8.
    # Reviewed: 2026-04-06
    "RUSTSEC-2023-0071",

    # sqlx 0.7.x — fix requires a sqlx 0.8 major version migration which
    # touches every query in the codebase. Scheduled for the post-launch
    # refactor sprint, after MED-004 module split lands.
    # Reviewed: 2026-04-06
    "RUSTSEC-2024-0363",

    # idna via validator crate — upgrade is gated on a validator major bump
    # that the upstream crate has not yet released. Tracked upstream.
    # Reviewed: 2026-04-06
    "RUSTSEC-2024-0421",

    # rustls-webpki 0.101.7 — TLS certificate name constraint validation bugs
    # (URI name constraints and wildcard name constraints incorrectly accepted).
    # Fix requires rustls-webpki >=0.103.12, which forces rustls 0.21 → 0.22+
    # and reqwest 0.11 → 0.12 (breaking API changes). This migration is out of
    # scope during the stabilization freeze. Yapper is a TLS client only — the
    # impact is that a maliciously crafted server cert could pass validation.
    # Mitigation: all Yapper backend connections go to well-known Neon/R2/AWS
    # endpoints pinned in configuration; no user-supplied TLS destinations.
    # Tracked: reqwest 0.12 migration in post-launch refactor sprint.
    # Reviewed: 2026-04-16
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",

    # rustls-webpki — reachable panic in CRL parsing (DoS via malformed
    # BIT STRING). Fix is >=0.103.13. The 0.103.x dependency tree (via
    # aws-sdk → rustls 0.23) was bumped to 0.103.13 in this commit. The
    # remaining hit is on rustls-webpki 0.101.7 reached via reqwest 0.11
    # → rustls 0.21, which cannot be patched without the same reqwest 0.12
    # migration that gates RUSTSEC-2026-0098/0099. Same mitigation applies:
    # Yapper is a TLS client to well-known pinned Neon/R2/AWS endpoints,
    # so a malformed-CRL DoS against the client is not an exposed attack
    # surface. Tracked alongside the reqwest 0.12 migration.
    # Reviewed: 2026-04-30
    "RUSTSEC-2026-0104",
]
