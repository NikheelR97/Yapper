# cargo-audit configuration.
#
# Audit ref: LOW-009. This file is the single source of truth for advisory
# ignores so local `cargo audit` runs and CI agree.
#
# IMPORTANT: every entry must include a justification and a review date.
# Re-review quarterly.

[advisories]
ignore = [
    # rsa 0.9.10: pulled in by sqlx-mysql and jsonwebtoken. Yapper uses
    # Postgres only, so the sqlx-mysql path is unreachable. jsonwebtoken uses
    # RSA for RS256 JWT signing/verification; no patched rsa release exists.
    # Mitigation during stabilization: keep JWT keys server-side only, monitor
    # upstream, and re-review replacing RS256/jsonwebtoken if a patched path
    # does not land before public launch.
    # Reviewed: 2026-05-26
    "RUSTSEC-2023-0071",
]
