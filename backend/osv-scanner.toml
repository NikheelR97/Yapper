[[IgnoredVulns]]
id = "RUSTSEC-2026-0104"
reason = "rustls-webpki reachable panic in CRL parsing. The 0.103.x path (aws-sdk → rustls 0.23) was bumped to 0.103.13. The remaining hit on rustls-webpki 0.101.7 is via reqwest 0.11 → rustls 0.21, gated on the same reqwest 0.12 migration as RUSTSEC-2026-0098/0099. Yapper is a TLS client to pinned Neon/R2/AWS endpoints — no user-supplied TLS destinations — so the malformed-CRL DoS surface is not exposed."

