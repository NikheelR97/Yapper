[package]
name = "yapper-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "yapper-server"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "set-header", "request-id"] }

# Database
sqlx = { version = "0.7", features = ["postgres", "uuid", "chrono", "runtime-tokio", "migrate", "tls-native-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

# Auth
argon2 = "0.5"
jsonwebtoken = "10"
oauth2 = "4"
url = "2"
validator = { version = "0.20", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
regex = "1"
once_cell = "1"

# IDs & time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Rate limiting (in-memory, no Redis)
governor = { version = "0.6", features = ["dashmap"] }
dashmap = "5"

# HTTP client (Discord API, Resend, FCM)
reqwest = { version = "0.11", features = ["json", "multipart"] }

# Cloudflare R2 (S3-compatible)
aws-sdk-s3 = "1"
aws-config = "1"

# Image processing (emoji WebP conversion — pure Rust, no ffmpeg)
image = { version = "0.24", features = ["png", "gif", "jpeg", "webp"] }

# Signal Protocol (native Rust — no WASM wrapper needed on server)
# Used for OPK consumption validation and key bundle verification only
# Full encryption/decryption happens on clients

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error monitoring
sentry = { version = "0.34", features = ["backtrace", "contexts", "panic", "tracing"] }

# Error handling
thiserror = "1"
anyhow = "1"
zip = "2"

# Async utilities
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# WebSocket
tokio-tungstenite = "0.21"

# Environment
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
axum-test = "14"

[profile.release]
opt-level = 2       # 2 vs 3 is negligible for an I/O-bound server
lto = false         # thin LTO serialises the final link step; not worth the cost
codegen-units = 16  # parallel LLVM codegen units (default); was 1
strip = true
